name: Release

on:
  push:
    tags:
      - "*"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmmirror.com
      - name: Install deps
        run: |
          npm config set registry https://registry.npmmirror.com
          npm ci
      - name: Lint
        run: npx eslint .

  release:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmmirror.com
      - name: Install deps
        run: |
          npm config set registry https://registry.npmmirror.com
          npm ci
      - name: Build
        run: npm run build
      - name: Generate build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
